name: luci-sso

# Compile-only, by design. luci-sso's own CI already runs unit, e2e and fuzz
# across 2 OpenWrt versions x 3 crypto backends on every change and on the tag
# it is built from, so re-running them here would add latency and no signal.
# What this workflow *does* add is architecture coverage: luci-sso's CI derives
# its SDK arch from the runner (uname -m), so it only ever compiles x86-64.
# These jobs are the only thing that builds the C extension for aarch64.

on:
  push:
    branches: [main, master]
    # A negated pattern after the others drops a file matched earlier, so a
    # push that changes only Markdown files, e.g. luci-sso/README.md, does not
    # build or publish. paths and paths-ignore cannot both be set on one event.
    paths:
      - 'luci-sso/**'
      - '.github/workflows/luci-sso.yml'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  # luci-sso/Makefile is generated, never edited here: luci-sso's
  # devenv/scripts/gen-feed-makefile.sh derives it from the release tarball
  # (`make feed-makefile VERSION=x` in luci-sso). This job regenerates it with
  # the generator from the tag PKG_VERSION names and fails on any difference,
  # so a hand edit, a stale copy or a wrong PKG_HASH never reaches the build
  # or the feed. The generator downloads the tarball itself, so a matching
  # PKG_HASH is proven too.
  drift:
    name: Makefile matches luci-sso release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
    env:
      LUCI_SSO_RAW: https://raw.githubusercontent.com/m00qek/luci-sso
    steps:
      - uses: actions/checkout@v6

      - name: Regenerate luci-sso/Makefile and compare
        run: |
          set -eu
          version=$(sed -n 's/^PKG_VERSION:=//p' luci-sso/Makefile)
          [ -n "$version" ] || { echo "::error file=luci-sso/Makefile::no PKG_VERSION"; exit 1; }
          gen="$RUNNER_TEMP/gen-feed-makefile.sh"
          script=devenv/scripts/gen-feed-makefile.sh

          # The generator the release itself shipped. Tags before it existed
          # (v0.10.0) fall back to luci-sso main's; either way it transforms
          # the Makefile inside the v$version tarball, not main's.
          code=$(curl -sSL --retry 3 -o "$gen" -w '%{http_code}' "$LUCI_SSO_RAW/v$version/$script" || true)
          if [ "$code" = 404 ]; then
            echo "::warning::luci-sso v$version has no $script; using the one on luci-sso main"
            code=$(curl -sSL --retry 3 -o "$gen" -w '%{http_code}' "$LUCI_SSO_RAW/main/$script" || true)
          fi
          [ "$code" = 200 ] || { echo "::error::could not fetch $script for v$version (HTTP $code)"; exit 1; }

          sh "$gen" -o "$RUNNER_TEMP/Makefile" "$version"
          if ! diff -u "$RUNNER_TEMP/Makefile" luci-sso/Makefile; then
            echo "::error file=luci-sso/Makefile::differs from the Makefile generated for luci-sso v$version. Regenerate it in luci-sso with: make feed-makefile VERSION=$version OUT=<this repo>/luci-sso/Makefile"
            exit 1
          fi
          echo "luci-sso/Makefile matches the one generated for v$version"

      # The feed's own release number for the luci-sso packages, passed to the
      # build as PKG_RELEASE, so the generated Makefile stays as generated. It
      # is raised, by hand or by luci-sso-deps.yml, to rebuild a luci-sso
      # version against a library OpenWrt has renamed since, e.g.
      # libwolfssl5.9.1.* -> libwolfssl5.9.2.*. It may not be lower than the
      # Makefile's own PKG_RELEASE, which it would otherwise hide.
      - name: Read luci-sso/feed-release
        id: release
        run: |
          set -eu
          release=$(cat luci-sso/feed-release)
          pkg_release=$(sed -n 's/^PKG_RELEASE:=//p' luci-sso/Makefile)
          case "$release" in
            ''|0*|*[!0-9]*)
              echo "::error file=luci-sso/feed-release::'$release' is not a release number: 1, 2, ..."
              exit 1 ;;
          esac
          if [ "$release" -lt "$pkg_release" ]; then
            echo "::error file=luci-sso/feed-release::$release is lower than PKG_RELEASE:=$pkg_release in luci-sso/Makefile"
            exit 1
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "luci-sso packages are built as release r$release"

  build:
    name: Build ${{ matrix.arch.pkg }} (${{ matrix.release.sdk_version }})
    needs: drift
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sdk = the SDK image tag, pkg = the OpenWrt package architecture.
        # They differ for x86 (x86-64 vs x86_64), and it is `pkg` that clients
        # look for: apk fetches <repo-url>/<pkg>/APKINDEX.tar.gz. Publishing
        # under the SDK name puts the packages somewhere apk never looks.
        arch:
          - { sdk: x86-64,             pkg: x86_64 }
          - { sdk: aarch64_generic,    pkg: aarch64_generic }
          - { sdk: aarch64_cortex-a53, pkg: aarch64_cortex-a53 }
        release:
          - { sdk_version: "24.10.6", feed_dir: "24.10" }
          - { sdk_version: "25.12.3", feed_dir: "25.12" }
    steps:
      - uses: actions/checkout@v6

      # The SDK image pins its feeds to the release tag (base at v24.10.6),
      # but routers on any 24.10.x install from OpenWrt's one feed for the
      # whole branch, rebuilt from openwrt-24.10. A library whose package name
      # carries its version, like libwolfssl5.9.1.e624513f, is renamed there
      # when the branch updates it, and a backend linked against the tag's
      # library can no longer be installed. So every feed is switched to the
      # branch, as luci-sso's devenv does, and the packages depend on the
      # libraries the live feed serves. luci-sso-deps.yml checks that daily.
      #
      # PKG_RELEASE on the command line overrides the Makefile's own, for
      # every package this make builds; only the luci-sso ones are kept.
      - name: Build packages
        run: |
          mkdir -p bin
          chmod 777 bin
          docker run --rm \
            -v ${{ github.workspace }}/luci-sso:/builder/package/luci-sso:ro \
            -v ${{ github.workspace }}/bin:/builder/bin \
            openwrt/sdk:${{ matrix.arch.sdk }}-${{ matrix.release.sdk_version }} \
            sh -c "
              set -e
              sed -i -E '/^src-git/s/[;^][^;^]*\$/;openwrt-${{ matrix.release.feed_dir }}/' feeds.conf.default
              cat feeds.conf.default
              ./scripts/feeds update -a &&
              ./scripts/feeds install -a &&
              make defconfig &&
              make package/luci-sso/compile -j\$(nproc) PKG_RELEASE=${{ needs.drift.outputs.release }} V=s
            "

      - name: Collect artifacts
        env:
          RELEASE: ${{ needs.drift.outputs.release }}
        run: |
          mkdir -p out
          find bin -type f \( -name 'luci-sso*.ipk' -o -name 'luci-sso*.apk' \) \
            -exec cp {} out/ \;
          echo "Built for ${{ matrix.arch.pkg }} / ${{ matrix.release.sdk_version }}:"
          ls -1 out
          # A green build that produced nothing is a silent failure, not a pass.
          [ -n "$(ls -A out)" ] || { echo "ERROR: no packages produced" >&2; exit 1; }
          # The feed release must be the one the packages carry: name_<v>-rN_<arch>.ipk
          # or name-<v>-rN.apk.
          for f in out/*; do
            case "$(basename "$f")" in
              *-r"$RELEASE"_*.ipk|*-r"$RELEASE".apk) ;;
              *) echo "ERROR: $(basename "$f") is not release r$RELEASE" >&2; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        with:
          name: luci-sso-${{ matrix.arch.pkg }}-${{ matrix.release.feed_dir }}
          path: out/

  deploy:
    name: Publish to feed
    needs: [drift, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared by every workflow that publishes: all commit to gh-pages, and
    # two concurrent runs would clobber each other's index.
    concurrency:
      group: feed-gh-pages
      cancel-in-progress: false
    steps:
      # main, at the commit that triggered this run, for scripts/ and the
      # public keys; gh-pages, the feed itself, in feed/.
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: feed
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dl
          pattern: luci-sso-*

      # luci-sso-<arch>-<release> -> staging/<release>/<arch>/. Every build
      # also produces the architecture-independent packages; publish.sh takes
      # those from the x86_64 build and checks the others produced the same.
      #
      # --deps-gate: a higher luci-sso/feed-release rebuilds a published
      # version against libraries OpenWrt has renamed since. Only the
      # packages whose dependencies differ from the newest published release
      # of the same version are filed: a rename of libwolfssl republishes
      # luci-sso-crypto-wolfssl, for the series and architectures it renamed
      # it in, and a router with another backend sees no upgrade.
      - name: Stage the packages
        run: |
          set -eu
          for d in dl/luci-sso-*; do
            name=$(basename "$d")                       # luci-sso-<arch>-<release>
            release=${name##*-}
            arch=${name#luci-sso-}; arch=${arch%-*}
            mkdir -p "staging/$release/$arch"
            cp "$d"/* "staging/$release/$arch/"
          done

      # scripts/publish.sh holds the feed layout, the signing and the index
      # rules for every workflow that publishes: it files the packages,
      # never replacing a published file, then regenerates and signs every
      # index, so whichever workflow publishes last, no index loses another's
      # packages.
      - name: File the packages and regenerate the indexes
        env:
          APK_FEED_SIGNING_KEY: ${{ secrets.APK_FEED_SIGNING_KEY }}
          OPKG_FEED_SIGNING_KEY: ${{ secrets.OPKG_FEED_SIGNING_KEY }}
        run: |
          sh scripts/publish.sh file --deps-gate staging feed
          sh scripts/publish.sh index --pubkeys . feed

      - name: Commit and push
        working-directory: feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 24.10/ 25.12/
          git diff --staged --quiet || git commit -m "publish luci-sso packages"
          git push
