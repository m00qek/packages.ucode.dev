name: luci-sso

# Compile-only, by design. luci-sso's own CI already runs unit, e2e and fuzz
# across 2 OpenWrt versions x 3 crypto backends on every change and on the tag
# it is built from, so re-running them here would add latency and no signal.
# What this workflow *does* add is architecture coverage: luci-sso's CI derives
# its SDK arch from the runner (uname -m), so it only ever compiles x86-64.
# These jobs are the only thing that builds the C extension for aarch64.

on:
  push:
    branches: [main, master]
    # A negated pattern after the others drops a file matched earlier, so a
    # push that changes only Markdown files, e.g. luci-sso/README.md, does not
    # build or publish. paths and paths-ignore cannot both be set on one event.
    paths:
      - 'luci-sso/**'
      - '.github/workflows/luci-sso.yml'
      - '!**/*.md'
  workflow_dispatch:

jobs:
  # luci-sso/Makefile is generated, never edited here: luci-sso's
  # devenv/scripts/gen-feed-makefile.sh derives it from the release tarball
  # (`make feed-makefile VERSION=x` in luci-sso). This job regenerates it with
  # the generator from the tag PKG_VERSION names and fails on any difference,
  # so a hand edit, a stale copy or a wrong PKG_HASH never reaches the build
  # or the feed. The generator downloads the tarball itself, so a matching
  # PKG_HASH is proven too.
  drift:
    name: Makefile matches luci-sso release
    runs-on: ubuntu-latest
    env:
      LUCI_SSO_RAW: https://raw.githubusercontent.com/m00qek/luci-sso
    steps:
      - uses: actions/checkout@v6

      - name: Regenerate luci-sso/Makefile and compare
        run: |
          set -eu
          version=$(sed -n 's/^PKG_VERSION:=//p' luci-sso/Makefile)
          [ -n "$version" ] || { echo "::error file=luci-sso/Makefile::no PKG_VERSION"; exit 1; }
          gen="$RUNNER_TEMP/gen-feed-makefile.sh"
          script=devenv/scripts/gen-feed-makefile.sh

          # The generator the release itself shipped. Tags before it existed
          # (v0.10.0) fall back to luci-sso main's; either way it transforms
          # the Makefile inside the v$version tarball, not main's.
          code=$(curl -sSL --retry 3 -o "$gen" -w '%{http_code}' "$LUCI_SSO_RAW/v$version/$script" || true)
          if [ "$code" = 404 ]; then
            echo "::warning::luci-sso v$version has no $script; using the one on luci-sso main"
            code=$(curl -sSL --retry 3 -o "$gen" -w '%{http_code}' "$LUCI_SSO_RAW/main/$script" || true)
          fi
          [ "$code" = 200 ] || { echo "::error::could not fetch $script for v$version (HTTP $code)"; exit 1; }

          sh "$gen" -o "$RUNNER_TEMP/Makefile" "$version"
          if ! diff -u "$RUNNER_TEMP/Makefile" luci-sso/Makefile; then
            echo "::error file=luci-sso/Makefile::differs from the Makefile generated for luci-sso v$version. Regenerate it in luci-sso with: make feed-makefile VERSION=$version OUT=<this repo>/luci-sso/Makefile"
            exit 1
          fi
          echo "luci-sso/Makefile matches the one generated for v$version"

  build:
    name: Build ${{ matrix.arch.pkg }} (${{ matrix.release.sdk_version }})
    needs: drift
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # sdk = the SDK image tag, pkg = the OpenWrt package architecture.
        # They differ for x86 (x86-64 vs x86_64), and it is `pkg` that clients
        # look for: apk fetches <repo-url>/<pkg>/APKINDEX.tar.gz. Publishing
        # under the SDK name puts the packages somewhere apk never looks.
        arch:
          - { sdk: x86-64,             pkg: x86_64 }
          - { sdk: aarch64_generic,    pkg: aarch64_generic }
          - { sdk: aarch64_cortex-a53, pkg: aarch64_cortex-a53 }
        release:
          - { sdk_version: "24.10.6", feed_dir: "24.10" }
          - { sdk_version: "25.12.3", feed_dir: "25.12" }
    steps:
      - uses: actions/checkout@v6

      - name: Build packages
        run: |
          mkdir -p bin
          chmod 777 bin
          docker run --rm \
            -v ${{ github.workspace }}/luci-sso:/builder/package/luci-sso:ro \
            -v ${{ github.workspace }}/bin:/builder/bin \
            openwrt/sdk:${{ matrix.arch.sdk }}-${{ matrix.release.sdk_version }} \
            sh -c "
              ./scripts/feeds update -a &&
              ./scripts/feeds install -a &&
              make defconfig &&
              make package/luci-sso/compile -j\$(nproc) V=s
            "

      - name: Collect artifacts
        run: |
          mkdir -p out
          find bin -type f \( -name 'luci-sso*.ipk' -o -name 'luci-sso*.apk' \) \
            -exec cp {} out/ \;
          echo "Built for ${{ matrix.arch.pkg }} / ${{ matrix.release.sdk_version }}:"
          ls -1 out
          # A green build that produced nothing is a silent failure, not a pass.
          [ -n "$(ls -A out)" ] || { echo "ERROR: no packages produced" >&2; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: luci-sso-${{ matrix.arch.pkg }}-${{ matrix.release.feed_dir }}
          path: out/

  deploy:
    name: Publish to feed
    needs: [drift, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with ci.yml's deploy job: both commit to gh-pages, and two
    # concurrent runs would clobber each other's index.
    concurrency:
      group: feed-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: staging
          pattern: luci-sso-*

      # luci-sso itself is PKGARCH:=all after 0.10.0: one package for every
      # architecture. Only the luci-sso-crypto-* packages carry the compiled
      # native.so and are built per architecture. Every build job produces the
      # `all` package too, but two builds of one version are not
      # byte-identical, so it is taken from the x86_64 build only; the other
      # builds must have produced the same file names, or the job fails.
      #
      #   24.10  `all`  -> 24.10/, the feed root, next to ucode-utest
      #          arch   -> 24.10/<arch>/
      #   25.12  noarch -> 25.12/noarch/, which every arch index lists
      #          arch   -> 25.12/<arch>/
      #
      # A 25.12 package's arch is the one apk records in it, read after it is
      # signed in a scratch directory. A version already published is never
      # replaced, so 0.10.0 and older stay per-arch, as they were published.
      - name: Sign and sort the packages into the feed
        env:
          APK_FEED_SIGNING_KEY: ${{ secrets.APK_FEED_SIGNING_KEY }}
        run: |
          set -eu
          ref=x86_64
          fail() { echo "::error::$*"; exit 1; }

          rm -rf new
          for d in staging/luci-sso-*; do
            [ -d "$d" ] || continue
            name=$(basename "$d")                       # luci-sso-<arch>-<feed_dir>
            feed_dir=${name##*-}                        # 24.10 | 25.12
            arch=${name#luci-sso-}; arch=${arch%-*}     # x86_64 | aarch64_*
            mkdir -p "new/$feed_dir/$arch"
            cp "$d"/* "new/$feed_dir/$arch/"
          done
          [ -d "new/24.10/$ref" ] && [ -d "new/25.12/$ref" ] \
            || fail "no $ref build: the architecture-independent packages are taken from it"

          # 25.12: sign each package and record its arch next to it.
          [ -n "${APK_FEED_SIGNING_KEY:-}" ] && printf '%s' "$APK_FEED_SIGNING_KEY" > /tmp/apk.key || true
          chmod -R 777 new/25.12
          docker run --rm \
            --user $(id -u):$(id -g) \
            $([ -f /tmp/apk.key ] && echo "-v /tmp/apk.key:/apk.key:ro") \
            -v ${{ github.workspace }}/new/25.12:/new \
            openwrt/sdk:x86-64-25.12.3 \
            sh -c "
              set -e
              for pkg in /new/*/*.apk; do
                if [ -f /apk.key ]; then
                  /builder/staging_dir/host/bin/apk adbsign \
                    --allow-untrusted --reset-signatures \
                    --sign-key /apk.key \"\$pkg\"
                fi
                arch=\$(/builder/staging_dir/host/bin/apk adbdump \"\$pkg\" 2>/dev/null | awk '/^ *arch:/{print \$2}')
                [ -n \"\$arch\" ] || { echo \"no arch in \$pkg\" >&2; exit 1; }
                echo \"\$arch\" > \"\$pkg.arch\"
              done
            "
          rm -f /tmp/apk.key

          # publish <package> <dest dir>: never replaces a published file.
          publish() {
            mkdir -p "$2"
            if [ -e "$2/$(basename "$1")" ]; then
              echo "kept   $2/$(basename "$1") (already published)"
            else
              cp "$1" "$2/" && echo "filed  $2/$(basename "$1")"
            fi
          }
          all_24() { ls "new/24.10/$1" | grep '_all\.ipk$' || true; }
          all_25() {
            for a in "new/25.12/$1"/*.apk.arch; do
              if [ -f "$a" ] && [ "$(cat "$a")" = noarch ]; then basename "${a%.arch}"; fi
            done
          }

          for dir in new/24.10/*/; do
            arch=$(basename "$dir")
            [ "$(all_24 "$arch")" = "$(all_24 "$ref")" ] \
              || fail "24.10: the $arch build has other \`all\` packages than the $ref build"
            for pkg in "$dir"*.ipk; do
              base=$(basename "$pkg")
              case "$base" in
                *_all.ipk)     if [ "$arch" = "$ref" ]; then publish "$pkg" 24.10; fi ;;
                *_"$arch".ipk) publish "$pkg" "24.10/$arch" ;;
                *)             fail "24.10: $base, from the $arch build, is neither $arch nor all" ;;
              esac
            done
          done

          for dir in new/25.12/*/; do
            arch=$(basename "$dir")
            [ "$(all_25 "$arch")" = "$(all_25 "$ref")" ] \
              || fail "25.12: the $arch build has other noarch packages than the $ref build"
            for pkg in "$dir"*.apk; do
              pkg_arch=$(cat "$pkg.arch")
              if [ "$pkg_arch" = noarch ]; then
                if [ "$arch" = "$ref" ]; then publish "$pkg" 25.12/noarch; fi
              elif [ "$pkg_arch" = "$arch" ]; then
                publish "$pkg" "25.12/$arch"
              else
                fail "25.12: $(basename "$pkg"), from the $arch build, is '$pkg_arch'"
              fi
            done
          done
          rm -rf new

      # Every package file stays on gh-pages so direct-download rollbacks keep
      # working, but each index lists only the newest version of a package, as
      # OpenWrt's own feeds do. The filter lives on main, not on gh-pages.
      - name: Fetch the newest-only index filter
        run: git show ${{ github.sha }}:scripts/newest-only-index.sh > "$RUNNER_TEMP/newest-only-index.sh"

      - name: Regenerate and sign the indexes
        env:
          APK_FEED_SIGNING_KEY: ${{ secrets.APK_FEED_SIGNING_KEY }}
          OPKG_FEED_SIGNING_KEY: ${{ secrets.OPKG_FEED_SIGNING_KEY }}
        run: |
          set -eu
          [ -n "${APK_FEED_SIGNING_KEY:-}" ] && printf '%s' "$APK_FEED_SIGNING_KEY" > /tmp/apk.key || true
          [ -n "${OPKG_FEED_SIGNING_KEY:-}" ] && printf '%s' "$OPKG_FEED_SIGNING_KEY" > /tmp/opkg.key || true

          # The 24.10 feed URL users add is the feed ROOT: opkg does not append
          # the architecture to a src/gz URL. The root Packages is a combined
          # index (ipkg-make-index recurses into the arch directories), rebuilt
          # here as well as by ci.yml, with the same filter: it lists luci-sso
          # once, as the newest `all` package, and each crypto backend once
          # per architecture.
          chmod -R 777 24.10 || true
          docker run --rm -v ${{ github.workspace }}/24.10:/pkgs \
            -v "$RUNNER_TEMP/newest-only-index.sh":/newest-only-index.sh:ro \
            --user $(id -u):$(id -g) \
            -e MKHASH=/builder/staging_dir/host/bin/mkhash \
            openwrt/sdk:x86-64-24.10.6 \
            sh -c "cd /pkgs && /builder/scripts/ipkg-make-index.sh . > /tmp/Packages.all &&
                   sh /newest-only-index.sh opkg < /tmp/Packages.all > Packages &&
                   gzip -9c Packages > Packages.gz"
          if [ -f /tmp/opkg.key ]; then
            docker run --rm -v /tmp/opkg.key:/opkg.key:ro -v ${{ github.workspace }}/24.10:/pkgs \
              --user $(id -u):$(id -g) \
              openwrt/sdk:x86-64-24.10.6 \
              /builder/staging_dir/host/bin/usign -S -m /pkgs/Packages -s /opkg.key -x /pkgs/Packages.sig
          fi

          # The per-arch 24.10 indexes list only their own directory. The root
          # index takes part as a shadow (never printed), so an arch index
          # drops a package the root serves, newer, as `all`: luci-sso after
          # 0.10.0 is at the root, and 24.10/<arch>/Packages lists only the
          # crypto backends.
          for dir in 24.10/*/ ; do
            [ -d "$dir" ] || continue
            chmod -R 777 "$dir" || true
            docker run --rm -v ${{ github.workspace }}/"$dir":/pkgs \
              -v ${{ github.workspace }}/24.10/Packages:/root-Packages:ro \
              -v "$RUNNER_TEMP/newest-only-index.sh":/newest-only-index.sh:ro \
              --user $(id -u):$(id -g) \
              -e MKHASH=/builder/staging_dir/host/bin/mkhash \
              openwrt/sdk:x86-64-24.10.6 \
              sh -c "cd /pkgs && /builder/scripts/ipkg-make-index.sh . > /tmp/Packages.all &&
                     sh /newest-only-index.sh opkg --shadow /root-Packages < /tmp/Packages.all > Packages &&
                     gzip -9c Packages > Packages.gz"
            if [ -f /tmp/opkg.key ]; then
              docker run --rm -v /tmp/opkg.key:/opkg.key:ro -v ${{ github.workspace }}/"$dir":/pkgs \
                --user $(id -u):$(id -g) \
                openwrt/sdk:x86-64-24.10.6 \
                /builder/staging_dir/host/bin/usign -S -m /pkgs/Packages -s /opkg.key -x /pkgs/Packages.sig
            fi
          done

          # apk only installs what the router's own <arch>/APKINDEX.tar.gz
          # lists, so each index also lists the newest noarch packages
          # (luci-sso, ucode-utest, ucode-docopt, wgpathd), published under
          # 25.12/noarch/; apk downloads them from there. ci.yml and
          # wgpathd.yml run the same loop over the same directories, so
          # whichever workflow publishes last, no index loses the others'
          # packages. The packages were signed when they were filed.
          mkdir -p 25.12/noarch
          for dir in 25.12/*/ ; do
            [ -d "$dir" ] || continue
            case "$dir" in 25.12/noarch/) continue ;; esac
            chmod -R 777 "$dir" || true
            docker run --rm -v ${{ github.workspace }}/"$dir":/pkgs \
              -v ${{ github.workspace }}/25.12/noarch:/noarch:ro \
              -v "$RUNNER_TEMP/newest-only-index.sh":/newest-only-index.sh:ro \
              --user $(id -u):$(id -g) \
              openwrt/sdk:x86-64-25.12.3 \
              sh -c "set -e
                     files=
                     for f in /noarch/*.apk /pkgs/*.apk; do
                       if [ -f \"\$f\" ]; then files=\"\$files \$f\"; fi
                     done
                     newest=\$(sh /newest-only-index.sh apk \$files)
                     /builder/staging_dir/host/bin/apk mkndx --allow-untrusted -o /pkgs/APKINDEX.tar.gz \$newest"
            if [ -f /tmp/apk.key ]; then
              docker run --rm -v /tmp/apk.key:/apk.key:ro -v ${{ github.workspace }}/"$dir":/pkgs \
                --user $(id -u):$(id -g) \
                openwrt/sdk:x86-64-25.12.3 \
                /builder/staging_dir/host/bin/apk adbsign --allow-untrusted --reset-signatures \
                  --sign-key /apk.key /pkgs/APKINDEX.tar.gz
            fi
          done
          rm -f /tmp/apk.key /tmp/opkg.key

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 24.10/ 25.12/
          git diff --staged --quiet || git commit -m "publish luci-sso packages"
          git push
