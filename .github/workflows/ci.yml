name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build packages (${{ matrix.sdk_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_version: "24.10.6"
            feed_dir: "24.10"
          - sdk_version: "25.12.3"
            feed_dir: "25.12"
    steps:
      - uses: actions/checkout@v6

      - name: Build packages
        run: |
          mkdir -p bin
          chmod 777 bin
          docker run --rm \
            -v ${{ github.workspace }}/ucode-docopt:/builder/package/ucode-docopt:ro \
            -v ${{ github.workspace }}/ucode-utest:/builder/package/ucode-utest:ro \
            -v ${{ github.workspace }}/bin:/builder/bin \
            openwrt/sdk:x86-64-${{ matrix.sdk_version }} \
            sh -c "
              ./scripts/feeds update base &&
              ./scripts/feeds install ucode &&
              make defconfig &&
              make package/ucode-docopt/compile package/ucode-utest/compile V=s
            "

      # bin/ also holds the dependencies the SDK built, e.g. ucode: only this
      # feed's packages are published.
      - name: Collect artifacts
        run: |
          mkdir -p out
          find bin -type f \( -name 'ucode-docopt[_-]*' -o -name 'ucode-utest[_-]*' \) \
            \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} out/ \;
          ls -1 out
          # A green build that produced nothing, or half of it, is a silent failure.
          [ "$(ls out | wc -l)" -eq 2 ] || { echo "ERROR: expected 2 packages" >&2; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.feed_dir }}
          path: out/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared by every workflow that publishes: all commit to gh-pages, and
    # two concurrent runs would clobber each other's index.
    concurrency:
      group: feed-gh-pages
      cancel-in-progress: false
    steps:
      # main, at the commit that triggered this run, for scripts/ and the
      # public keys; gh-pages, the feed itself, in feed/.
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: feed
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: packages-24.10
          path: staging/24.10/noarch

      - uses: actions/download-artifact@v8
        with:
          name: packages-25.12
          path: staging/25.12/noarch

      # scripts/publish.sh holds the feed layout, the signing and the index
      # rules for every workflow that publishes: it files the packages,
      # never replacing a published file, then regenerates and signs every
      # index, so whichever workflow publishes last, no index loses another's
      # packages.
      - name: File the packages and regenerate the indexes
        env:
          APK_FEED_SIGNING_KEY: ${{ secrets.APK_FEED_SIGNING_KEY }}
          OPKG_FEED_SIGNING_KEY: ${{ secrets.OPKG_FEED_SIGNING_KEY }}
        run: |
          sh scripts/publish.sh file staging feed
          sh scripts/publish.sh index --pubkeys . feed

      - name: Commit and push
        working-directory: feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 24.10/ 25.12/
          git diff --staged --quiet || git commit -m "chore: deploy packages from ${GITHUB_SHA::8}"
          git push
